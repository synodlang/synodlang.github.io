name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check line endings, trailing spaces and final newline
        shell: bash
        run: |
          status=0
          count=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            count=$((count + 1))
            if grep -q $'\r' "$f"; then
              echo "::error file=$f::CRLF line endings"
              status=1
            fi
            if grep -qE '[[:space:]]+$' "$f"; then
              echo "::error file=$f::trailing whitespace"
              status=1
            fi
            if [ -n "$(tail -c 1 "$f")" ]; then
              echo "::error file=$f::missing newline at end of file"
              status=1
            fi
          done < <(git ls-files -z -- '*.md' '*.go' '*.mod' '*.ts' '*.js' '*.json' '*.css' '*.html' '*.sh' '*.yml')
          echo "Checked $count file(s)."
          exit $status

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Fetch the pinned dependencies
        run: go run ./tools/build fetch
      - name: Build the site
        run: go run ./tools/build build -out _site
      - name: Check the site
        run: go run ./tools/build check -out _site
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - name: Install the browser tests
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: test/browser
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test/browser/playwright-report
            test/browser/test-results
          if-no-files-found: ignore
          retention-days: 7
