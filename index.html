<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synod</title>
<meta name="description" content="A small language for watching distributed systems think.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDE9E1;--fg:#151A2E;--accent:#9A5400;--rule:#c9c3b6}
@media (prefers-color-scheme:dark){:root{--bg:#151A2E;--fg:#EDE9E1;--accent:#F4A340;--rule:#2d3450}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--fg);font:400 1rem/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
main{max-width:40rem;margin:0 auto;padding:2rem 16px}
h1{margin:0 0 .5rem;font-size:2.25rem;color:var(--accent)}
p{margin:0 0 1.5rem}
nav{display:flex;flex-wrap:wrap;gap:1rem}
a{color:var(--accent);font-weight:700}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>Synod</h1>
<p>A small language for watching distributed systems think.</p>
<nav aria-label="Primary">
<a href="/install/">Install</a>
<a href="https://github.com/synodlang">GitHub</a>
</nav>
</main>
</body>
</html>
